const area = document.getElementById('t');

function upd(){
  const v = area.value;
  const total = v.split('\n').length;
  if(mediaOn){
    pos.textContent = rawOn ? 'картинка текстом' : (isVideoName(curName) ? 'видео' : 'картинка');
    if(!rawOn) cnt.textContent = '';

    pos.textContent = 'просмотр';

    const line = bookActive() ? lineAtY(area.scrollTop) + 1 : v.slice(0, area.selectionStart).split('\n').length;

let pending = false;
let gutNow = '';
function syncScroll(){
  root.style.setProperty('--sy', (-area.scrollTop) + 'px');

let backStale = false;
function buildBack(){
  if(document.body.classList.contains('preview') || (mediaOn && !rawOn)){ backStale = true; return; }   // холст скрыт, ширина textarea = 0
  const lines = area.value.split('\n');
  const digits = Math.max(3, String(lines.length).length + 1);
  const gut = 'calc(' + digits + 'ch + 1.7rem)';
  if(gut !== gutNow){ gutNow = gut; root.style.setProperty('--gut', gut); }
  root.style.setProperty('--gutw', digits + 'ch');
  const frag = document.createDocumentFragment();
  for(const t of lines){
    const d = document.createElement('div');
    d.className = 'ln';
    d.textContent = t;
    frag.append(d);
  }
  back.textContent = '';
  back.append(frag);
  const wpx = document.body.classList.contains('nowrap') ? area.scrollWidth : area.clientWidth;
  if(wpx > 0) back.style.width = wpx + 'px';
  syncScroll();
  upd();
  highlightView();
  if(findHits.length) scheduleFindPaint();
  if(bookActive()) bookApply(false);
}
const wrapbtn = document.getElementById('wrapbtn');
function isCodeName(name){
  const m = /\.([A-Za-z0-9]+)$/.exec((name || '').split('/').pop());
  return !!(m && HL_LANGS[m[1].toLowerCase()]);
}
function autoWrap(text, name){
  if(/\.(md|markdown|txt|tex|rst|org|adoc)$/i.test(name || '')) return true;   // проза: заголовки и абзацы читаются только с переносом
  if(!isCodeName(name)) return true;
  let max = 0, cur = 0;
  for(let i = 0; i < text.length; i++){
    if(text.charCodeAt(i) === 10){ if(cur > max) max = cur; cur = 0; }
    else cur++;
  }
  if(cur > max) max = cur;
  return max > 2000;      // минифицированная простыня: без переноса её вбок листать бессмысленно
}
function applyWrap(on, keep){
  if(bookActive()) on = true;
  if(!keep){
    st.wrap = on ? 1 : 0;
    save();
  }
  area.setAttribute('wrap', on ? 'soft' : 'off');
  document.body.classList.toggle('nowrap', !on);
  wrapbtn.classList.toggle('on', on);
  area.scrollLeft = 0;
  syncScroll();
  scheduleBack();
}
wrapbtn.addEventListener('click', () => applyWrap(document.body.classList.contains('nowrap')));
function scheduleBack(){
  if(pending) return;
  pending = true;
  requestAnimationFrame(() => { pending = false; buildBack(); });
}
const HL_LANGS = {py:'python',pyw:'python',js:'javascript',mjs:'javascript',cjs:'javascript',jsx:'javascript',ts:'typescript',tsx:'typescript',json:'json',md:'markdown',markdown:'markdown',sh:'bash',bash:'bash',zsh:'bash',yml:'yaml',yaml:'yaml',toml:'ini',ini:'ini',cfg:'ini',conf:'ini',service:'ini',desktop:'ini',html:'xml',htm:'xml',xml:'xml',css:'css',scss:'scss',c:'c',h:'c',cc:'cpp',cpp:'cpp',hpp:'cpp',go:'go',rs:'rust',java:'java',kt:'kotlin',rb:'ruby',php:'php',lua:'lua',pl:'perl',sql:'sql',diff:'diff',patch:'diff',cs:'csharp',swift:'swift',dart:'dart',ex:'elixir',exs:'elixir',erl:'erlang',hrl:'erlang',hs:'haskell',lhs:'haskell',clj:'clojure',cljs:'clojure',cljc:'clojure',scala:'scala',sc:'scala',groovy:'groovy',gvy:'groovy',gradle:'groovy',ps1:'powershell',psm1:'powershell',jl:'julia',tex:'latex',sty:'latex',proto:'protobuf',cmake:'cmake',mk:'makefile',bat:'dos',cmd:'dos',vbs:'vbscript',asm:'x86asm',s:'x86asm',f90:'fortran',f95:'fortran',for:'fortran',pas:'delphi',elm:'elm',lisp:'lisp',lsp:'lisp',scm:'scheme',tcl:'tcl',vim:'vim',vhd:'vhdl',vhdl:'vhdl',v:'verilog',sv:'verilog',thrift:'thrift',properties:'properties',nginx:'nginx',apache:'apache',http:'http',r:'r',awk:'awk',coffee:'coffeescript',fs:'fsharp',ipynb:'json',lock:'json'};
const HL_NAMES = {Dockerfile:'dockerfile',Makefile:'makefile',makefile:'makefile',GNUmakefile:'makefile',CMakeLists:'cmake','.gitignore':'plaintext','.dockerignore':'plaintext','.editorconfig':'ini','.env':'properties','.bashrc':'bash','.zshrc':'bash','.vimrc':'vim'};
let hlTimer = 0;
function langOf(name){
  const base = (name || '').split('/').pop();
  if(HL_NAMES[base]) return HL_NAMES[base] === 'plaintext' ? '' : HL_NAMES[base];
  if(base.startsWith('CMakeLists.')) return 'cmake';
  const m = /\.([A-Za-z0-9]+)$/.exec(base);
  return m ? (HL_LANGS[m[1].toLowerCase()] || '') : '';
}
function scheduleHighlight(){
  clearTimeout(hlTimer);
  hlTimer = setTimeout(highlightView, 80);
}
function hlSplit(html){
  const out = [];
  const stack = [];
  let line = '';
  let i = 0;
  while(i < html.length){
    if(html[i] === '<'){
      const end = html.indexOf('>', i);
      if(end === -1){ line += html.slice(i); break; }
      const tag = html.slice(i, end + 1);
      if(tag === '</span>'){ stack.pop(); line += tag; }
      else {
        const m = /class="([^"]*)"/.exec(tag);
        stack.push(m ? m[1] : '');
        line += tag;
      }
      i = end + 1;
    } else if(html[i] === '\n'){
      out.push(line + '</span>'.repeat(stack.length));
      line = stack.map(c => c ? '<span class="' + c + '">' : '<span>').join('');
      i++;
    } else {
      line += html[i];
      i++;
    }
  }
  out.push(line + '</span>'.repeat(stack.length));
  return out;
}
function lineAtY(y){
  const nodes = back.children;
  let lo = 0;
  let hi = nodes.length - 1;
  let res = 0;
  while(lo <= hi){
    const mid = (lo + hi) >> 1;
    const el = nodes[mid];
    if(el.offsetTop + el.offsetHeight >= y){ res = mid; hi = mid - 1; }
    else lo = mid + 1;
  }
  return res;
}
function lastLineAtY(y){
  const nodes = back.children;
  let lo = 0;
  let hi = nodes.length - 1;
  let res = nodes.length - 1;
  while(lo <= hi){
    const mid = (lo + hi) >> 1;
    if(nodes[mid].offsetTop <= y){ res = mid; lo = mid + 1; }
    else hi = mid - 1;
  }
  return res;
}
function highlightView(){
  const lang = langOf(curName);
  const nodes = back.children;
  if(!lang || !nodes.length || !window.hljs || !window.hljs.getLanguage(lang)) return;
  const start = Math.max(0, lineAtY(area.scrollTop) - 120);
  const end = Math.min(nodes.length - 1, lastLineAtY(area.scrollTop + area.clientHeight) + 60);
  const lines = area.value.split('\n');
  const slice = lines.slice(start, end + 1).join('\n');
  let html = '';
  try { html = hljs.highlight(slice, {language: lang, ignoreIllegals: true}).value; }
  catch(e){ return; }
  const parts = hlSplit(html);
  for(let i = 0; i < parts.length; i++){
    const node = nodes[start + i];
    if(node && node.innerHTML !== parts[i]) node.innerHTML = parts[i];
  }
}
area.addEventListener('input', scheduleBack);
const bookpageInp = document.getElementById('bookpage');
bookpageInp.addEventListener('focus', () => bookpageInp.select());
bookpageInp.addEventListener('input', () => { bookpageInp.value = bookpageInp.value.replace(/\D/g, ''); });
bookpageInp.addEventListener('keydown', e => {
  if(e.key === 'Enter'){
    e.preventDefault();
    const n = parseInt(bookpageInp.value, 10);
    if(n >= 1) bookGoto(n);
    bookpageInp.blur();
  } else if(e.key === 'Escape'){
    e.preventDefault();
    bookpageInp.value = bookPageN;
    bookpageInp.blur();
  }
});
area.addEventListener('scroll', () => { syncScroll(); scheduleHighlight(); if(findHits.length) scheduleFindPaint(); });
window.addEventListener('resize', () => { scheduleBack(); if(bookActive()) bookApply(); });
document.querySelector('.editor').addEventListener('wheel', e => {
  if(e.ctrlKey) return;
  if(document.body.classList.contains('preview')) return;   // в просмотре скроллит сам просмотр
  if(mediaOn && !rawOn) return;   // колесо над картинкой зумит, а не мотает скрытый текст
  if(bookActive()){ e.preventDefault(); return; }
  if(e.target === area) return;
  e.preventDefault();
  area.scrollTop += e.deltaY;
}, {passive:false});
scheduleBack();

function zoomBy(d){
  st.fs = Math.min(24, Math.max(11, (st.fs || FS0) + d));
  applyFs();
  scheduleBack();
  save();
}
function zoomReset(){
  delete st.fs;
  applyFs();
  scheduleBack();
  save();
}
document.getElementById('plus').addEventListener('click', () => zoomBy(1));
document.getElementById('minus').addEventListener('click', () => zoomBy(-1));
document.getElementById('theme').addEventListener('click', () => { st.theme = root.classList.contains('light') ? 'dark' : 'light'; applyTheme(); save(); });
document.getElementById('reset').addEventListener('click', () => zoomReset());

document.getElementById('cp').addEventListener('click', async function(){
  const btn = this;
  const txt = document.getElementById('t').value;

  catch(e){
    const ta = document.createElement('textarea');
    ta.value = txt; ta.style.position = 'fixed'; ta.style.opacity = '0';
    document.body.append(ta); ta.select();
    try { document.execCommand('copy'); } catch(e2){}
    ta.remove();
  }
  const use = document.getElementById('cpuse');
  const lbl = document.getElementById('cplbl');
  use.setAttribute('href', '#i-check');
  lbl.textContent = 'скопировано';
  btn.classList.add('ok');
  setTimeout(() => {
    use.setAttribute('href', '#i-copy');
    lbl.textContent = 'копировать весь текст';
    btn.classList.remove('ok');
  }, 900);
});

const staleBox = document.getElementById('stale');

const saveBtn = document.getElementById('save');
const savelbl = document.getElementById('savelbl');
const target = document.getElementById('target');
let dirty = false;
const fileParam = new URLSearchParams(location.search).get('file');
const serverFiles = [];
let serverMode = false;
let serverTarget = null;
let readonlyPath = null;
let pendingHandle = null;   // прошлый локальный файл, которому после F5 нужен доступ: карточка предложит «вернуться»
let rootPath = '';
let loadError = '';
let loadToken = 0;

function canWrite(){ return !!serverTarget; }
function targetText(){
  if(loadError) return loadError;
  if(mediaOn){
    if(rawOn) return 'только просмотр: картинка текстом — кнопка «картинка» вернёт изображение';
    if(isVideoName(curName)) return 'только просмотр: видео';
    return 'только просмотр: картинка — колесо зумит, двойной клик вписывает';
  }
  if(readonlyPath) return 'только чтение: ' + readonlyPath;

async function saveFile(){

    clearTimeout(statusTimer);
    statusTimer = setTimeout(() => setDirty(dirty), 1200);
    return;
  }
  if(readonlyPath){
    saveBtn.textContent = 'только чтение';
    clearTimeout(statusTimer);
    statusTimer = setTimeout(() => setDirty(dirty), 1200);
    return;

    saveBtn.disabled = true;
    savelbl.textContent = 'сохраняю…';

      const w = await localHandle.createWritable();
      await w.write(area.value);
      await w.close();
    };
    try {
      try {
        await put();
      } catch(e){
        if(!e || e.name !== 'NotAllowedError') throw e;
        let perm = 'denied';
        try { perm = await localHandle.requestPermission({mode: 'readwrite'}); } catch(_){}
        if(perm !== 'granted') throw e;
        await put();
      }
      saved();
    } catch(e){
      savelbl.textContent = 'локальный файл не принял';
      clearTimeout(statusTimer);
      statusTimer = setTimeout(() => setDirty(dirty), 1400);
    } finally {
      saveBtn.disabled = false;

    return;
  }
  if(!serverTarget){
    savelbl.textContent = 'некуда писать';
    clearTimeout(statusTimer);
    statusTimer = setTimeout(() => setDirty(dirty), 1200);
    return;
  }
  if(!area.value.trim() && !confirm('текст пустой — затереть файл?')) return;

  savelbl.textContent = 'сохраняю…';

  } finally {

  statusTimer = setTimeout(() => setDirty(dirty), 1400);
}

function pathResolve(raw){
  let p = (raw || '').trim().replace(/^["']+|["']+$/g, '').replace(/\\/g, '/');
  while(p.length > 1 && p.endsWith('/')) p = p.slice(0, -1);
  if(p.startsWith('~')){ navNote('~ не понимаю — дай полный путь или путь от корня'); return; }
  const rootAbs = rootPath.replace(/\/+$/, '');
  if(p.startsWith('/')){
    if(p === rootAbs || p + '' === rootAbs){ p = ''; }
    else if(p.startsWith(rootAbs + '/')){ p = p.slice(rootAbs.length + 1); }
    else { pathOpenAbs(p); return; }
  }
  pathOpen(p);
}

    if(String(e.message) === '404'){
      const suffix = serverFiles.filter(p => p.endsWith('/' + rel));
      if(suffix.length === 1){ openServerFile(suffix[0]); return; }   // путь без папки — ищем уникальный хвост
      const twins = serverFiles.filter(p => p.split('/').pop() === base && p !== rel).slice(0, 3);
      loadError = 'не нашёл: ' + rel + (twins.length ? ' — такой файл есть: ' + twins.join(', ') : '');
    } else {
      loadError = 'не прочитал: ' + rel;
    }
    loadText('', base);
    setDirty(dirty);
    tabBlur();
  });
}

function demoFallback(){
  if(!fileParam && area.value === '') loadText(RAW, document.getElementById('fname').textContent);
}
async function initServer(){
  if(!/^https?:$/.test(location.protocol)) return;
  try {
    const r = await fetch('/__list');
    if(!r.ok){ demoFallback(); return; }
    const data = await r.json();
    const files = Array.isArray(data) ? data : (data && data.files);
    if(!Array.isArray(files)) return;
    serverMode = true;
    navbtn.hidden = false;
    rootPath = (data && data.root) || '';
    serverFiles.length = 0;
    serverFiles.push(...files);
    tabRestore(files);
    if(serverTarget){
      // уже открывается по ?file= или старой памяти
    } else if(fileParam){
      // ?file= главнее памяти: его поток загрузки сам разберётся (в том числе с ошибкой)
    } else if(st.file && files.indexOf(st.file) !== -1){
      openServerFile(st.file);
    } else if(!tabOpenSaved()){
      loadText('', '');
    }
    if(bookActive()) bookApply(false);
    setDirty(dirty);
  } catch(e){ demoFallback(); }
}

if(fileParam && /^https?:$/.test(location.protocol)) openServerFile(fileParam);
initServer();
const bookbtn = document.getElementById('bookbtn');
const bookl = document.getElementById('bookl');
const bookr = document.getElementById('bookr');
const booknum = document.getElementById('booknum');
let bookRowsN = 10;
let bookPageN = 1;
let bookWrapWas = true;
function bookLineH(){ return Math.max(8, Math.round(parseFloat(getComputedStyle(area).lineHeight) || 20)); }
function bookActive(){ return document.body.classList.contains('book'); }
function bookRowsPx(){ return bookRowsN * bookLineH(); }
function bookPadY(){ return parseFloat(getComputedStyle(root).getPropertyValue('--bpy')) || 20; }
function bookContentH(){
  const lns = back.children;
  return lns.length ? lns[lns.length - 1].offsetTop + lns[lns.length - 1].offsetHeight : 0;
}
function bookPages(){ return Math.max(1, Math.ceil(bookContentH() / bookRowsPx())); }
function bookUpdate(){
  if(!bookActive()) return;
  document.getElementById('booktotal').textContent = bookPages();
  const inp = document.getElementById('bookpage');
  if(document.activeElement !== inp) inp.value = bookPageN;
}
function bookTarget(){
  return Math.min((Math.min(bookPageN, bookPages()) - 1) * bookRowsPx(), Math.max(0, area.scrollHeight - area.clientHeight));
}
function bookShow(){
  bookPageN = Math.min(Math.max(1, bookPageN), bookPages());
  root.style.setProperty('--book-h', (bookRowsPx() + 2 * bookPadY() + 2) + 'px');
  area.scrollTop = bookTarget();
  syncScroll();
  upd();
  bookUpdate();
}
function bookFit(){
  const ratio = parseFloat(getComputedStyle(root).getPropertyValue('--book-lh-ratio')) || 1.75;
  const pitch = Math.max(8, Math.round(parseFloat(getComputedStyle(area).fontSize) * ratio));
  root.style.setProperty('--book-lhp', pitch + 'px');
  const padY = bookPadY();
  bookRowsN = Math.max(3, Math.floor((document.querySelector('main').clientHeight - 2 - 2 * padY) / pitch));
}
function bookApply(sched){
  if(!bookActive()) return;
  bookFit();
  bookPageN = Math.floor(area.scrollTop / bookRowsPx()) + 1;
  if(sched !== false) scheduleBack();
  bookShow();
}
function bookGoto(n){
  bookPageN = Math.min(Math.max(1, n), bookPages());
  bookShow();
}
function bookToggle(on){
  const to = on === undefined ? !bookActive() : on;
  if(mediaOn && !rawOn && to) return;
  document.body.classList.toggle('book', to);
  updateViewBtn();
  bookbtn.classList.toggle('on', to);
  bookbtn.setAttribute('aria-pressed', to ? 'true' : 'false');
  st.book = to ? 1 : 0;
  save();
  booknum.hidden = !to;
  if(to){
    bookWrapWas = !document.body.classList.contains('nowrap');
    applyWrap(true, true);
    if(!bookWrapWas) buildBack();
    area.blur();
    bookApply();
  } else {
    root.style.removeProperty('--book-h');
    if(!bookWrapWas) applyWrap(false);
    scheduleBack();
  }
}
bookbtn.addEventListener('click', () => bookToggle());
bookl.addEventListener('click', () => bookGoto(bookPageN - 1));
bookr.addEventListener('click', () => bookGoto(bookPageN + 1));
area.addEventListener('scroll', () => {
  if(!bookActive()) return;
  const target = bookTarget();
  if(Math.abs(area.scrollTop - target) > 0.5) area.scrollTop = target;
  upd();
  bookUpdate();
});
window.addEventListener('keydown', e => {
  if(!bookActive() || e.ctrlKey || e.metaKey || e.altKey) return;
  if(e.key === 'ArrowLeft' || e.key === 'PageUp'){ e.preventDefault(); bookGoto(bookPageN - 1); }
  else if(e.key === 'ArrowRight' || e.key === 'PageDown'){ e.preventDefault(); bookGoto(bookPageN + 1); }
});
const findbtn = document.getElementById('findbtn');
const findwrap = document.getElementById('findwrap');
const findin = document.getElementById('findin');
const findcnt = document.getElementById('findcnt');
const findcase = document.getElementById('findcase');
let findHits = [], findIdx = -1, findStarts = [0], findCase = false, findPaintPending = false;
function findLines(){
  findStarts = [0];
  const v = area.value;
  for(let i = 0; i < v.length; i++) if(v.charCodeAt(i) === 10) findStarts.push(i + 1);
}
function findLineOf(off){
  let lo = 0, hi = findStarts.length - 1;
  while(lo < hi){
    const mid = (lo + hi + 1) >> 1;
    if(findStarts[mid] <= off) lo = mid; else hi = mid - 1;
  }
  return lo;
}
function rangeInLine(el, off, len){
  const w = document.createTreeWalker(el, NodeFilter.SHOW_TEXT);
  const stop = off + len;
  let node, pos = 0, start = null, startOff = 0, end = null, endOff = 0;
  while((node = w.nextNode())){
    const l = node.nodeValue.length;
    if(start === null && off <= pos + l){ start = node; startOff = off - pos; }
    if(start !== null && stop <= pos + l){ end = node; endOff = stop - pos; break; }
    pos += l;
  }
  if(!start || !end) return null;
  const r = document.createRange();
  r.setStart(start, startOff);
  r.setEnd(end, endOff);
  return r;
}
function paintFind(){
  findPaintPending = false;
  if(!window.CSS || !CSS.highlights || typeof Highlight === 'undefined') return;
  const top = area.scrollTop - area.clientHeight, bot = area.scrollTop + 2 * area.clientHeight;
  const all = [], cur = [];
  for(let i = 0; i < findHits.length; i++){
    const h = findHits[i];
    const el = back.children[h[0]];
    if(!el) continue;
    if(i !== findIdx && !(el.offsetTop + el.offsetHeight > top && el.offsetTop < bot)) continue;
    const r = rangeInLine(el, h[1], h[2]);
    if(!r) continue;
    (i === findIdx ? cur : all).push(r);
  }
  CSS.highlights.set('find', new Highlight(...all));
  CSS.highlights.set('find-cur', new Highlight(...cur));
}
function scheduleFindPaint(){
  if(findPaintPending) return;
  findPaintPending = true;
  requestAnimationFrame(paintFind);
}
function findClear(){
  findHits = [];
  findIdx = -1;
  findcnt.textContent = '';
  scheduleFindPaint();
}
function findRun(keepIdx){
  const q = findin.value;
  if(!q){ findClear(); return; }
  findLines();
  const hay = findCase ? area.value : area.value.toLowerCase();
  const needle = findCase ? q : q.toLowerCase();
  const hits = [];
  let i = hay.indexOf(needle);
  while(i !== -1 && hits.length < 20000){ hits.push(i); i = hay.indexOf(needle, i + needle.length); }
  findHits = hits.map(o => { const ln = findLineOf(o); return [ln, o - findStarts[ln], q.length]; });
  if(!findHits.length){ findIdx = -1; findcnt.textContent = 'нет'; scheduleFindPaint(); return; }
  if(keepIdx && findIdx >= 0){
    findIdx = Math.min(findIdx, findHits.length - 1);
  } else {
    const caret = area.selectionStart || 0;
    const at = findHits.findIndex(h => findStarts[h[0]] + h[1] >= caret);
    findIdx = at < 0 ? 0 : at;
  }
  findJump();
}
function findStep(d){
  if(!findHits.length){ findRun(false); return; }
  findIdx = (findIdx + d + findHits.length) % findHits.length;
  findJump();
}
function findJump(){
  const h = findHits[findIdx];
  findcnt.textContent = h ? (findIdx + 1) + ' / ' + findHits.length : 'нет';
  if(h){
    const el = back.children[h[0]];
    if(el){
      if(bookActive()) bookGoto(Math.floor(el.offsetTop / bookRowsPx()) + 1);
      else {
        area.scrollTop = Math.max(0, el.offsetTop - Math.round(area.clientHeight / 3));
        syncScroll();
      }
    }
  }
  paintFind();
}
function findJumpToLine(line){
  const at = findHits.findIndex(h => h[0] === line - 1);
  if(at >= 0) findIdx = at;
  findJump();
}
function findOpen(on){
  findwrap.hidden = !on;
  if(on){
    findin.focus();
    findin.select();
    if(findin.value) findRun(true);
  } else {
    findClear();
  }
}
findbtn.addEventListener('click', () => findOpen(findwrap.hidden));
findin.addEventListener('input', () => findRun(true));
findin.addEventListener('keydown', e => {
  if(e.key === 'Enter'){
    e.preventDefault();
    findStep(e.shiftKey ? -1 : 1);
  } else if(e.key === 'Escape'){
    e.preventDefault();
    findOpen(false);
    area.focus();
  }
});
findcase.addEventListener('click', () => {
  findCase = !findCase;
  findcase.classList.toggle('on', findCase);
  findcase.setAttribute('aria-pressed', findCase ? 'true' : 'false');
  if(findin.value) findRun(false);
});
window.addEventListener('keydown', e => {
  if((e.ctrlKey || e.metaKey) && e.shiftKey && 'fFаА'.indexOf(e.key) !== -1){
    e.preventDefault();
    if(nav.hidden) openNav(navDir);
    navgrep.focus();
    navgrep.select();
    return;
  }
  if((e.ctrlKey || e.metaKey) && !e.shiftKey && 'fFаА'.indexOf(e.key) !== -1){
    e.preventDefault();
    findOpen(true);
    return;
  }
  if(e.key === 'F3'){
    e.preventDefault();
    if(findwrap.hidden) findOpen(true); else findStep(e.shiftKey ? -1 : 1);
  } else if(e.key === 'Escape' && !findwrap.hidden){
    findOpen(false);
  }
}, true);
if(st.book) bookToggle(true);
setDirty(false);
</script>
